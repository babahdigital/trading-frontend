name: CI

# Quality gates pada setiap PR + push ke main.
# Tidak push image — itu tugas docker-publish.yml.
# Goal: verifikasi cepat (≤5 menit) sebelum kode masuk main.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # JOB 1 — detect what changed
  # -------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      docker: ${{ steps.filter.outputs.docker }}
      ci: ${{ steps.filter.outputs.ci }}
      schema: ${{ steps.filter.outputs.schema }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'src/**'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.js'
              - 'tsconfig.json'
              - 'tailwind.config.*'
              - 'postcss.config.*'
            docker:
              - 'Dockerfile'
              - 'docker-compose*.yml'
              - '.dockerignore'
            ci:
              - '.github/workflows/**'
            schema:
              - 'prisma/schema.prisma'
              - 'prisma/migrations/**'
      - name: Show change summary
        run: |
          {
            echo "### Path Change Summary"
            echo "- app: ${{ steps.filter.outputs.app }}"
            echo "- docker: ${{ steps.filter.outputs.docker }}"
            echo "- ci: ${{ steps.filter.outputs.ci }}"
            echo "- schema: ${{ steps.filter.outputs.schema }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------
  # JOB 2 — Next.js quality gates (typecheck + lint + build)
  # -------------------------------------------------------------
  app:
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.schema == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dummy?schema=public
      JWT_SECRET: ci-dummy-secret-not-used-in-production
      LICENSE_MW_MASTER_KEY: ci-dummy-master-key
      VPS1_BACKEND_URL: http://localhost:18000
      NEXT_PUBLIC_APP_URL: https://babahalgo.com
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck (strict, no skipLibCheck)
        run: npx tsc --noEmit

      # Lint via ESLint flat config (Next 16 removed `next lint`).
      # Allow warnings (react-hooks v7 strict rules masih 'warn' di config —
      # belum di-fix incremental). Errors tetap fail-build.
      - name: Lint (errors block, warnings allowed)
        run: npx eslint . --max-warnings 200

      # i18n parity gate: tolak PR kalau id.json punya keys yang belum
      # ada di en.json. Cuma cek dry-run — tidak butuh OPENROUTER_API_KEY,
      # script exit 1 kalau ada keys missing. Author harus run
      # `npm run i18n:sync` lokal sebelum push.
      - name: i18n parity check (id.json ↔ en.json)
        run: npm run i18n:sync -- --dry

      # Build verbose + tee log → cek warning patterns dari Next.js compiler.
      # Next.js sering tampilkan "Warning:" untuk hydration issue / metadata
      # collision yang tidak fail-build tapi blocker untuk production. Kita
      # fail-build kalau detect warning.
      - name: Build (verify + warning detection)
        run: |
          set -o pipefail
          npx next build 2>&1 | tee build.log

          # Pattern penanda warning yang harus diperhatikan
          if grep -E "^(Warning|warn):" build.log > /tmp/warnings.txt; then
            echo "::error::Next.js emitted warnings during build"
            cat /tmp/warnings.txt
            exit 1
          fi
          # Hydration mismatch / metadata collision lain
          if grep -qiE "(hydration mismatch|metadata.*conflict|missing alt|invalid hook call)" build.log; then
            echo "::error::Build log contains issue patterns"
            grep -iE "(hydration mismatch|metadata.*conflict|missing alt|invalid hook call)" build.log
            exit 1
          fi

      - name: Build size summary
        if: always()
        run: |
          {
            echo "### Build Output"
            if [ -f .next/build-manifest.json ]; then
              echo "- Build manifest: present"
            fi
            if [ -d .next/standalone ]; then
              SIZE=$(du -sh .next/standalone | cut -f1)
              echo "- Standalone output: $SIZE"
            fi
            # Top 5 largest first-load JS bundles untuk monitor bloat
            if [ -f build.log ]; then
              echo ""
              echo "**Largest routes (First Load JS):**"
              echo '```'
              grep -E "^[├└│ ]+(ƒ|○|●)" build.log 2>/dev/null | sort -k4 -rh 2>/dev/null | head -10 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # API surface audit — verify daftar route handler yang ada di repo
      # matches expected production surface. Skip routes di-redirect (301/302).
      # Output ringkasan untuk debugging drift.
      - name: API surface inventory
        if: always()
        run: |
          {
            echo ""
            echo "### API Surface"
            echo '```'
            find src/app/api -name 'route.ts' -o -name 'route.tsx' 2>/dev/null \
              | sed 's|src/app/api|/api|; s|/route\.tsx\?$||' \
              | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------
  # JOB 3 — Docker build smoke test (no push)
  # -------------------------------------------------------------
  docker-smoke:
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (verify only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          tags: babahdigital/babahalgo-frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
