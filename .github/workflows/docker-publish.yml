name: Docker Publish + Deploy

# Build amd64 image (VPS3 = amd64) → push ke Docker Hub → trigger deploy ke VPS3.
# Trigger:
#   - push ke main (tag: latest, sha-<short>, dan branch=main)
#   - push tag v* (tag: latest, v1.2.3, semver)
#   - workflow_dispatch (manual)
#
# Required GitHub secrets:
#   DOCKER_USERNAME       — Docker Hub login (sama dengan project lain di org)
#   DOCKER_PASSWORD       — Docker Hub access token (PAT, bukan password akun)
#   VPS3_SSH_HOST         — 148.230.96.201
#   VPS3_SSH_PORT         — 1983
#   VPS3_SSH_USER         — abdullah
#   VPS3_SSH_KEY          — private key (id_raspi_ed25519 content, full PEM)
#   VPS3_DEPLOY_PATH      — /opt/trading-commercial

env:
  DOCKER_BUILDKIT: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IMAGE_NAME: babahdigital/babahalgo-frontend

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Skip auto-deploy ke VPS3 (image tetap di-publish)"
        type: boolean
        required: false
        default: false
      cleanup_cache:
        description: "Bersihkan build cache GHA sebelum build (lambat tapi reproducible)"
        type: boolean
        required: false
        default: false

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # JOB 1 — Build & push multi-arch image
  # -------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validasi Secret Docker Hub
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "::error::DOCKER_USERNAME secret tidak tersedia"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "::error::DOCKER_PASSWORD secret tidak tersedia"
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=BabahAlgo Frontend
            org.opencontainers.image.description=Institutional trading platform commerce frontend (Next.js)
            org.opencontainers.image.vendor=Babah Digital
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build & push (amd64 only — match VPS3 arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=babahalgo
          cache-to: type=gha,mode=max,scope=babahalgo${{ inputs.cleanup_cache == true && ',ignore-error=true' || '' }}

      - name: Image summary
        run: |
          {
            echo "### Image Published"
            echo "- Image: \`${{ env.IMAGE_NAME }}\`"
            echo "- Primary tag: \`${{ steps.meta.outputs.version }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Platforms: linux/amd64, linux/arm64"
            echo ""
            echo "**All tags pushed:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------
  # JOB 2 — Deploy ke VPS3:
  #   1. Sync compose files
  #   2. Bootstrap folder structure (data/, public/, scratch/)
  #   3. Pull image + zero-downtime restart + healthcheck
  #   4. Cleanup source code (idempotent — VPS3 cuma punya compose+mounts)
  # -------------------------------------------------------------
  deploy:
    needs: build-and-push
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && inputs.skip_deploy != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS3_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh-keyscan kadang gagal transient — make it non-fatal, fallback ke accept-new
          ssh-keyscan -p ${{ secrets.VPS3_SSH_PORT }} -H ${{ secrets.VPS3_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<SSHCFG
          Host vps3
            HostName ${{ secrets.VPS3_SSH_HOST }}
            Port ${{ secrets.VPS3_SSH_PORT }}
            User ${{ secrets.VPS3_SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
          SSHCFG
          chmod 600 ~/.ssh/config

      - name: Sync compose files to VPS3
        env:
          SSH_PORT: ${{ secrets.VPS3_SSH_PORT }}
          SSH_USER: ${{ secrets.VPS3_SSH_USER }}
          SSH_HOST: ${{ secrets.VPS3_SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.VPS3_DEPLOY_PATH }}
        run: |
          # Pakai tar pipe + ssh (lebih reliable dari scp sftp-based di OpenSSH 9+)
          tar -cf - docker-compose.prod.yml docker-compose.db.yml | \
            ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes \
              "$SSH_USER@$SSH_HOST" \
              "mkdir -p '$DEPLOY_PATH' && cd '$DEPLOY_PATH' && tar -xf -"
          # Verify
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "ls -la '$DEPLOY_PATH/docker-compose.prod.yml' '$DEPLOY_PATH/docker-compose.db.yml'"

      - name: Bootstrap folder structure + public assets
        env:
          SSH_HOST: ${{ secrets.VPS3_SSH_HOST }}
          SSH_PORT: ${{ secrets.VPS3_SSH_PORT }}
          SSH_USER: ${{ secrets.VPS3_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.VPS3_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes \
            -o SendEnv=DEPLOY_PATH \
            "$SSH_USER@$SSH_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          echo "== bootstrap folders =="
          mkdir -p data/backups/daily data/backups/weekly data/backups/monthly
          mkdir -p public scratch
          chmod 750 data/backups

          # First-time bootstrap public/ from image (cuma kalau folder kosong)
          if [ -z "$(ls -A public 2>/dev/null)" ]; then
            echo "== bootstrap public/ from image =="
            docker pull babahdigital/babahalgo-frontend:latest
            docker run --rm -v "$(pwd)/public:/dest" babahdigital/babahalgo-frontend:latest \
              sh -c 'cp -r /app/public/. /dest/ 2>/dev/null && chown -R 1001:1001 /dest 2>/dev/null || true'
            echo "public/ bootstrapped: $(ls public | wc -l) entries"
          fi
          REMOTE

      - name: Pull image + zero-downtime restart
        env:
          SSH_HOST: ${{ secrets.VPS3_SSH_HOST }}
          SSH_PORT: ${{ secrets.VPS3_SSH_PORT }}
          SSH_USER: ${{ secrets.VPS3_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.VPS3_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes \
            -o SendEnv=DEPLOY_PATH \
            "$SSH_USER@$SSH_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          # Stop legacy stack (build-based docker-compose.yml) if running
          if [ -f docker-compose.yml ] && docker compose -f docker-compose.yml ps -q 2>/dev/null | grep -q .; then
            echo "== stopping legacy build-based stack =="
            docker compose -f docker-compose.yml down --remove-orphans || true
          fi

          echo "== docker compose pull =="
          docker compose -f docker-compose.prod.yml pull

          echo "== docker compose up -d =="
          docker compose -f docker-compose.prod.yml up -d --force-recreate

          echo "== healthcheck poll =="
          for i in $(seq 1 15); do
            STATUS=$(docker inspect --format '{{.State.Health.Status}}' trading-commercial-app-1 2>/dev/null || echo 'starting')
            echo "attempt $i: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "container healthy ✓"
              break
            fi
            if [ "$i" = "15" ]; then
              echo "::error::Container failed to become healthy within 90s"
              docker compose -f docker-compose.prod.yml logs app --tail=80
              exit 1
            fi
            sleep 6
          done
          REMOTE

      - name: Cleanup source code (whitelist-only)
        env:
          SSH_HOST: ${{ secrets.VPS3_SSH_HOST }}
          SSH_PORT: ${{ secrets.VPS3_SSH_PORT }}
          SSH_USER: ${{ secrets.VPS3_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.VPS3_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes \
            -o SendEnv=DEPLOY_PATH \
            "$SSH_USER@$SSH_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          # Whitelist: file/folder yang TIDAK dihapus saat cleanup.
          # Pattern bash anchored regex (=~) — pakai ERE flavor.
          KEEP_RE='^(docker-compose\.prod\.yml|docker-compose\.db\.yml|\.env|\.env\.example|data|public|scratch|\.docker)$'
          BACKUP_RE='^\.env\.bak-'

          echo "== state SEBELUM cleanup =="
          ls -A | head -30

          # Collect entries dengan bash array (avoid pipefail pitfall — grep return
          # 1 saat 0 matches yang akan trigger exit 1 di pipefail+set-e).
          mapfile -t ENTRIES < <(ls -A)

          TO_DELETE=()
          for item in "${ENTRIES[@]}"; do
            [ -z "$item" ] && continue
            if [[ "$item" =~ $KEEP_RE ]] || [[ "$item" =~ $BACKUP_RE ]]; then
              continue
            fi
            TO_DELETE+=("$item")
          done

          echo "== entries to delete (${#TO_DELETE[@]}) =="
          if [ ${#TO_DELETE[@]} -eq 0 ]; then
            echo "  (none — workspace already clean)"
          else
            printf '  %s\n' "${TO_DELETE[@]}"
          fi

          # Delete loop — root-owned items pakai sudo -n fallback (NOPASSWD), kalau
          # gagal skip dengan warning (non-fatal, akan di-pickup cleanup berikutnya).
          DELETED=0
          SKIPPED=0
          for item in "${TO_DELETE[@]:-}"; do
            [ -z "$item" ] && continue
            if [ ! -e "$item" ]; then continue; fi
            if rm -rf "$item" 2>/dev/null; then
              DELETED=$((DELETED + 1))
            elif sudo -n rm -rf "$item" 2>/dev/null; then
              DELETED=$((DELETED + 1))
            else
              echo "  !! skip $item (mungkin root-owned tanpa NOPASSWD)"
              SKIPPED=$((SKIPPED + 1))
            fi
          done

          # Hapus .env.bak lama (>30 hari) — keep recent backup untuk audit
          PRUNED_BAK=$(find . -maxdepth 1 -name '.env.bak-*' -mtime +30 -print -delete 2>/dev/null | wc -l)

          echo "== state SETELAH cleanup =="
          ls -A
          du -sh . 2>/dev/null | head -1
          echo "summary: deleted=$DELETED skipped=$SKIPPED pruned_old_backups=$PRUNED_BAK"
          REMOTE

      - name: Public smoke test (full API + page surface)
        run: |
          set -e
          BASE="https://babahalgo.com"

          # Probe table: route → expected status codes (multiple OK karena auth-gate /
          # redirect bisa return 200/307/401 tergantung deploy mode).
          # Format: <method>|<path>|<allowed-codes-comma-separated>
          PROBES=(
            "GET|/|200"
            "GET|/login|200"
            "GET|/admin/login|200"
            "GET|/register|200"
            "GET|/pricing|200"
            "GET|/demo|200"
            "GET|/contact|200"
            "GET|/about|200"
            "GET|/about/team|200"
            "GET|/about/governance|200"
            "GET|/performance|200"
            "GET|/research|200"
            "GET|/status|200"
            "GET|/changelog|200"
            "GET|/platform|200"
            "GET|/platform/strategies|200"
            "GET|/platform/strategies/smc|200"
            "GET|/platform/strategies/smc-swing|200"
            "GET|/platform/strategies/pivot-mean-reversion|200"
            "GET|/platform/strategies/wyckoff|308,301"
            "GET|/platform/strategies/astronacci|308,301"
            "GET|/platform/strategies/ai-momentum|308,301"
            "GET|/platform/strategies/oil-gas|308,301"
            "GET|/platform/technology|200"
            "GET|/platform/risk-framework|200"
            "GET|/platform/execution|200"
            "GET|/platform/instruments|200"
            "GET|/solutions/signal|200"
            "GET|/solutions/crypto|200"
            "GET|/solutions/license|200"
            "GET|/solutions/institutional|200"
            "GET|/register/signal|200"
            "GET|/register/crypto|200"
            "GET|/register/vps|200"
            "GET|/register/institutional|200"
            "GET|/legal/terms|200"
            "GET|/legal/privacy|200"
            "GET|/legal/risk-disclosure|200"
            "GET|/legal/regulatory|200"
            "GET|/legal/cookies|200"
            "GET|/forgot-password|200"
            "GET|/portal|200,307"
            "GET|/admin|200,307"
            "GET|/non-existent-page-xyz|404"
            "GET|/sitemap.xml|200"
            "GET|/robots.txt|200"
            "GET|/api/health|200"
            "GET|/api/public/capabilities|200"
            "GET|/api/public/strategy-stats|200"
            "GET|/api/public/contact-info|200"
            "GET|/api/public/company|200"
            "GET|/api/public/performance|200"
            "GET|/api/public/pricing|200"
            "GET|/api/public/landing|200"
            "GET|/api/public/changelog|200"
            "GET|/api/public/articles|200"
            "GET|/api/public/banners|200"
            "GET|/api/public/popups|200"
            "GET|/api/public/testimonials|200"
            "GET|/api/public/faq|200"
            "GET|/api/public/status|200"
            "GET|/api/client/signals|401"
            "GET|/api/client/positions|401"
            "GET|/api/client/notifications/recent|401"
            "GET|/api/client/notifications/outbound|401"
            "GET|/api/admin/dashboard|401"
            "GET|/api/admin/audit|401"
            "GET|/api/auth/me|401"
          )

          FAIL=0
          PASS=0
          REPORT=""
          for probe in "${PROBES[@]}"; do
            METHOD="${probe%%|*}"
            REST="${probe#*|}"
            PATH_PART="${REST%%|*}"
            ALLOWED="${REST##*|}"
            CODE=$(curl -sS -o /dev/null -m 10 -X "$METHOD" -w "%{http_code}" "$BASE$PATH_PART" || echo "ERR")
            if echo ",$ALLOWED," | grep -q ",$CODE,"; then
              PASS=$((PASS + 1))
              echo "✓ $METHOD $PATH_PART → $CODE (expected: $ALLOWED)"
            else
              FAIL=$((FAIL + 1))
              echo "✗ $METHOD $PATH_PART → $CODE (expected: $ALLOWED)"
              REPORT="$REPORT- \`$METHOD $PATH_PART\` returned **$CODE**, expected $ALLOWED\n"
            fi
          done

          # Body sanity check — pastikan landing render content (bukan blank shell)
          echo ""
          echo "== body sanity check =="
          BODY_LEN=$(curl -sS -m 10 "$BASE/" | wc -c)
          echo "Landing body bytes: $BODY_LEN"
          if [ "$BODY_LEN" -lt 5000 ]; then
            FAIL=$((FAIL + 1))
            REPORT="$REPORT- Landing body too small ($BODY_LEN bytes) — possible render failure\n"
            echo "::error::Landing page body suspiciously small ($BODY_LEN bytes)"
          fi

          {
            echo "### Smoke Test Result"
            echo "- Passed: $PASS"
            echo "- Failed: $FAIL"
            echo "- Total: $((PASS + FAIL))"
            if [ "$FAIL" -gt 0 ]; then
              echo ""
              echo "**Failures:**"
              echo -e "$REPORT"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAIL" -gt 0 ]; then
            echo "::error::$FAIL endpoint(s) returned unexpected status"
            exit 1
          fi
          echo "All $PASS endpoints pass."

      # Hygiene: setiap deploy bikin image lama jadi <none> tagged → numpuk cepat.
      # `docker image prune -af` hapus semua image yang tidak referenced container
      # running. Aman karena healthcheck di atas sudah pass = container baru
      # active. Builder + container prune sebagai safety net. Non-fatal supaya
      # network glitch tidak break deploy.
      - name: Cleanup VPS3 Docker hygiene (post-deploy prune)
        if: success()
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.VPS3_SSH_HOST }}
          SSH_PORT: ${{ secrets.VPS3_SSH_PORT }}
          SSH_USER: ${{ secrets.VPS3_SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "== disk + docker BEFORE prune =="
          df -h / | head -2
          docker system df

          echo "== docker image prune -af (hapus image tidak terpakai) =="
          docker image prune -af 2>&1 | tail -5

          echo "== docker container prune -f (hapus container exited) =="
          docker container prune -f 2>&1 | tail -3

          echo "== docker builder prune -af (hapus build cache) =="
          docker builder prune -af 2>&1 | tail -3

          echo "== disk + docker AFTER prune =="
          df -h / | head -2
          docker system df
          REMOTE

      - name: Deploy summary
        if: success()
        run: |
          {
            echo "### Deploy Successful"
            echo "- Target: VPS3 (${{ secrets.VPS3_SSH_HOST }})"
            echo "- Image tag: \`${{ needs.build-and-push.outputs.image_tag }}\`"
            echo "- Production URL: https://babahalgo.com"
            echo "- Healthcheck: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
